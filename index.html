<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <title>Kerberos SPNEGO demo (Node.js + Express)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 40px;
      }
      button {
        padding: 10px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      pre {
        background: #f6f8fa;
        padding: 16px;
        border-radius: 8px;
        overflow: auto;
      }
      .ok {
        color: #0a7f2e;
      }
      .err {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Kerberos SPNEGO demo</h1>
    <p>
      Ovaj primer pokazuje kako browser ili CLI može da se autentifikuje preko
      Kerberosa prema Node.js serveru.
    </p>

    <button id="btn">Prijavi me (Negotiate / SPNEGO)</button>

    <h3>Rezultat:</h3>
    <pre id="out">Klikni dugme...</pre>

    <script>
      const out = document.getElementById("out");
      const btn = document.getElementById("btn");

      btn.addEventListener("click", async () => {
        out.textContent = "Šaljem zahtev...";

        try {
          // Bitno: credentials:'include' da browser sme da radi SPNEGO (zavisi i od policy-ja)
          const r = await fetch("/api/auth", {
            method: "GET",
            credentials: "include", // dozvoli pregovaranje / kolačiće
          });

          // Ako je server odgovorio 401 sa 'WWW-Authenticate: Negotiate',
          // browser može da pokuša ponovo sa SPNEGO tokenom (u domenskim okruženjima).
          const text = await r.text();
          let pretty;
          try {
            pretty = JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            pretty = text;
          }

          out.textContent = `Status: ${r.status}\n\n${pretty}`;
        } catch (e) {
          out.textContent = `Greška: ${e.message}`;
        }
      });
    </script>
  </body>
</html>
